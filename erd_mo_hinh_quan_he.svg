<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="tableGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
    <linearGradient id="tblHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .title-dark { font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .subtitle-dark { font-size: 13px; fill: #94a3b8; }
    .table-title { font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
    .col-pk { font-size: 11px; font-weight: 700; fill: #fbbf24; }
    .col-fk { font-size: 11px; font-weight: 600; fill: #a78bfa; }
    .col-normal { font-size: 11px; fill: #cbd5e1; }
    .col-type { font-size: 10px; fill: #64748b; font-family: monospace; }
    .rel-line-dark { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; opacity: 0.75; }
  </style>

  <!-- Header -->
  <text x="40" y="45" class="title-dark">MÔ HÌNH DỮ LIỆU QUAN HỆ (RELATIONAL SCHEMA) - CSDL QUẢN LÝ ĐƠN HÀNG</text>
  <text x="40" y="68" class="subtitle-dark">Chuyển đổi từ mô hình ERD chuẩn hóa sang các bảng quan hệ với khóa chính (PK) và khóa ngoại (FK)</text>

  <!-- TABLE 1: DON_VI_KHACH (x: 40, y: 100) -->
  <g transform="translate(40, 100)" filter="url(#tableGlow)">
    <rect width="210" height="135" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="210" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 DON_VI_KHACH</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 MaDV</text><text x="150" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">TenDV</text><text x="150" y="72" class="col-type">NVARCHAR</text>
    <text x="12" y="94" class="col-normal">DiaChi</text><text x="150" y="94" class="col-type">NVARCHAR</text>
    <text x="12" y="116" class="col-normal">DienThoai</text><text x="150" y="116" class="col-type">VARCHAR</text>
  </g>

  <!-- TABLE 2: NGUOI_DAT (x: 40, y: 290) -->
  <g transform="translate(40, 290)" filter="url(#tableGlow)">
    <rect width="210" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="210" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 NGUOI_DAT</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 MaND</text><text x="150" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">HoTenND</text><text x="150" y="72" class="col-type">NVARCHAR</text>
    <text x="12" y="94" class="col-fk">🔗 MaDV (FK)</text><text x="150" y="94" class="col-type">VARCHAR</text>
  </g>

  <!-- TABLE 3: DON_DAT_HANG (x: 40, y: 460) -->
  <g transform="translate(40, 460)" filter="url(#tableGlow)">
    <rect width="210" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="210" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 DON_DAT_HANG</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 SoDH</text><text x="150" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">NgayDat</text><text x="150" y="72" class="col-type">DATE</text>
    <text x="12" y="94" class="col-fk">🔗 MaND (FK)</text><text x="150" y="94" class="col-type">VARCHAR</text>
  </g>

  <!-- TABLE 4: CHI_TIET_DAT_HANG (x: 320, y: 460) -->
  <g transform="translate(320, 460)" filter="url(#tableGlow)">
    <rect width="230" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="230" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 CHI_TIET_DAT_HANG</text>
    <line x1="0" y1="30" x2="230" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑🔗 SoDH (PK, FK)</text><text x="170" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-pk">🔑🔗 MaHang (PK, FK)</text><text x="170" y="72" class="col-type">VARCHAR</text>
    <text x="12" y="94" class="col-normal">SoLuongDat</text><text x="170" y="94" class="col-type">INT</text>
  </g>

  <!-- TABLE 5: HANG (x: 480, y: 270) -->
  <g transform="translate(480, 270)" filter="url(#tableGlow)">
    <rect width="220" height="135" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 HANG</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 MaHang</text><text x="160" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">TenHang</text><text x="160" y="72" class="col-type">NVARCHAR</text>
    <text x="12" y="94" class="col-normal">DvTinh</text><text x="160" y="94" class="col-type">NVARCHAR</text>
    <text x="12" y="116" class="col-normal">MoTaHang</text><text x="160" y="116" class="col-type">NVARCHAR</text>
  </g>

  <!-- TABLE 6: CHI_TIET_GIAO_HANG (x: 620, y: 460) -->
  <g transform="translate(620, 460)" filter="url(#tableGlow)">
    <rect width="230" height="135" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="230" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 CHI_TIET_GIAO_HANG</text>
    <line x1="0" y1="30" x2="230" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑🔗 SoPG (PK, FK)</text><text x="170" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-pk">🔑🔗 MaHang (PK, FK)</text><text x="170" y="72" class="col-type">VARCHAR</text>
    <text x="12" y="94" class="col-normal">SoLuongGiao</text><text x="170" y="94" class="col-type">INT</text>
    <text x="12" y="116" class="col-normal">DonGiaGiao</text><text x="170" y="116" class="col-type">DECIMAL</text>
  </g>

  <!-- TABLE 7: PHIEU_GIAO_HANG (x: 920, y: 460) -->
  <g transform="translate(920, 460)" filter="url(#tableGlow)">
    <rect width="240" height="160" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 PHIEU_GIAO_HANG</text>
    <line x1="0" y1="30" x2="240" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 SoPG</text><text x="180" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">NgayGiao</text><text x="180" y="72" class="col-type">DATE</text>
    <text x="12" y="94" class="col-fk">🔗 MaNG (FK)</text><text x="180" y="94" class="col-type">VARCHAR</text>
    <text x="12" y="116" class="col-fk">🔗 MaNN (FK)</text><text x="180" y="116" class="col-type">VARCHAR</text>
    <text x="12" y="138" class="col-fk">🔗 MaDDG (FK)</text><text x="180" y="138" class="col-type">VARCHAR</text>
  </g>

  <!-- TABLE 8: NGUOI_NHAN (x: 920, y: 100) -->
  <g transform="translate(920, 100)" filter="url(#tableGlow)">
    <rect width="220" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 NGUOI_NHAN</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 MaNN</text><text x="160" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">HoTenNN</text><text x="160" y="72" class="col-type">NVARCHAR</text>
    <text x="12" y="94" class="col-fk">🔗 MaDV (FK)</text><text x="160" y="94" class="col-type">VARCHAR</text>
  </g>

  <!-- TABLE 9: NGUOI_GIAO (x: 920, y: 280) -->
  <g transform="translate(920, 280)" filter="url(#tableGlow)">
    <rect width="220" height="95" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 NGUOI_GIAO</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 MaNG</text><text x="160" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">HoTenNG</text><text x="160" y="72" class="col-type">NVARCHAR</text>
  </g>

  <!-- TABLE 10: NOI_GIAO (x: 920, y: 650) -->
  <g transform="translate(920, 650)" filter="url(#tableGlow)">
    <rect width="220" height="95" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="30" rx="6" fill="url(#tblHeadGrad)"/>
    <text x="12" y="20" class="table-title">📁 NOI_GIAO</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155"/>
    <text x="12" y="50" class="col-pk">🔑 MaDDG</text><text x="160" y="50" class="col-type">VARCHAR</text>
    <text x="12" y="72" class="col-normal">TenNoiGiao</text><text x="160" y="72" class="col-type">NVARCHAR</text>
  </g>

  <!-- Ghi chú / Legend -->
  <g transform="translate(40, 660)">
    <rect width="810" height="85" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" font-size="12" font-weight="700" fill="#38bdf8">💡 QUY TẮC RÀNG BUỘC TOÀN VẸN VÀ THỰC THỂ:</text>
    <text x="20" y="50" font-size="11" fill="#cbd5e1">• <tspan fill="#fbbf24" font-weight="bold">🔑 Primary Key (PK):</tspan> Khóa chính phân biệt duy nhất từng bản ghi.</text>
    <text x="20" y="68" font-size="11" fill="#cbd5e1">• <tspan fill="#a78bfa" font-weight="bold">🔗 Foreign Key (FK):</tspan> Khóa ngoại liên kết bảng cha - con đảm bảo tính toàn vẹn tham chiếu.</text>
    <text x="450" y="50" font-size="11" fill="#cbd5e1">• Bảng <tspan fill="#38bdf8" font-weight="bold">CHI_TIET_DAT_HANG</tspan> và <tspan fill="#38bdf8" font-weight="bold">CHI_TIET_GIAO_HANG</tspan> giải quyết quan hệ N-M.</text>
    <text x="450" y="68" font-size="11" fill="#cbd5e1">• Cột <tspan fill="#f43f5e" font-weight="bold">Thành tiền</tspan> = SoLuongGiao * DonGiaGiao (được tính bằng Query, không lưu cứng).</text>
  </g>
</svg>
